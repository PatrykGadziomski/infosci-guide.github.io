name: Studiengang in Datenbank übernehmen
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pages: write
jobs:
  add:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eintrag einfügen
        id: insert
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python3 scripts/add_program.py data/studiengaenge.db > result.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Committen
        if: steps.insert.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/studiengaenge.db
          git commit -m "Studiengang aus Issue #${{ github.event.issue.number }} hinzugefügt"
          git push
      - name: Pages neu bauen
        if: steps.insert.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Issue beantworten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.insert.outputs.status }}" = "0" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body "✅ $(cat result.txt)"
            gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY"
          else
            gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body "❌ $(cat result.txt)"
          fi
